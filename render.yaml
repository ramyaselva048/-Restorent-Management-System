services:
  # Fullstack Web Service on Render
  - type: web
    name: restoflow-restaurant-app
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

  # FastAPI Backend Service (optional standalone)
  - type: web
    name: restoflow-fastapi-backend
    env: python
    rootDir: backend
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restoflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: restoflow-postgres
    plan: standard
    databaseName: restoflow
    user: postgres
